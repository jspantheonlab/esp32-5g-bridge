[package]
name = "bridge5g-dongle"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Raspberry Pi USB-C 5G dongle for iPhone: calls, SMS and status over the USB network link"

[[bin]]
name = "bridge5g-dongle"
path = "src/main.rs"

[dependencies]
bridge-core = { path = "../firmware-rs/bridge-core" }
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
nix = { version = "0.29", features = ["term", "fs"] }

[profile.release]
strip = true
